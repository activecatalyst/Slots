<style>
:root{
  --bg:#131110; --s1:#1b1917; --s2:#24211e; --s3:#2e2a26; --line:#35302b;
  --tx:#f3efe9; --mu:#a39a90; --mu2:#6f675f;
  --acc:#00e5ff; --acc-d:#00e5ff22; --acc-tx:#04181b;
  --kc:#e0c9a0; --kc-d:#e0c9a01f;
  --r:16px; --r2:12px;
  --nav:68px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{min-height:120px;font:13px/1.4 ui-monospace,Menlo,monospace}
#app{max-width:560px;margin:0 auto;padding:calc(12px + var(--safe-t)) 16px calc(var(--nav) + var(--safe-b) + 96px)}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:28px 0 10px;font-weight:600}
.muted{color:var(--mu)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack>*+*{margin-top:10px}

/* top bar */
.top{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.navbtn{width:48px;height:48px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:20px;display:grid;place-items:center}
.datebtn{flex:1;text-align:center;min-height:48px}
.datebtn b{display:block;font-size:18px}
.chip-tier{padding:0 12px;height:48px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:13px;font-weight:600}

/* hero */
.hero{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-size:38px;font-weight:700;line-height:1;letter-spacing:-.02em}
.ring .lbl{font-size:12px;color:var(--mu);margin-top:4px}
.kcbox{flex:1;min-width:0}
.kcnum{font-size:22px;font-weight:700}
.bar{height:10px;border-radius:6px;background:var(--s3);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bar i.k{background:var(--kc)} .bar i.p{background:var(--acc)} .bar i.pl{background:repeating-linear-gradient(135deg,#ffffff22 0 4px,transparent 4px 8px)}
.bar i.over{background:repeating-linear-gradient(135deg,var(--kc) 0 6px,#bfa77e 6px 12px)}
.bar.thin{height:6px}
.macros{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--mu)}
.macros b{color:var(--tx);font-weight:600}

/* slots */
.slot{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;overflow:hidden}
.slot.open{border-color:#4a443d}
.slot-h{padding:14px 14px 10px}
.slot-h .name{font-weight:650;font-size:17px}
.lock{font-size:11px;color:var(--kc);border:1px solid #e0c9a055;border-radius:20px;padding:2px 8px;margin-left:6px;font-weight:600;letter-spacing:.02em}
.borrowtag{font-size:11px;color:var(--mu);margin-left:6px}
.slot-nums{font-size:13px;color:var(--mu);text-align:right;line-height:1.3}
.slot-nums b{color:var(--tx)}
.slot-bars{display:grid;gap:5px;margin-top:10px}
.entries{border-top:1px solid var(--line)}
.entry{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;min-height:56px;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .en{flex:1;min-width:0}
.entry .en div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry.planned{background:repeating-linear-gradient(135deg,transparent 0 10px,#ffffff05 10px 20px)}
.entry.planned .en{opacity:.7}
.x{width:48px;height:48px;border-radius:10px;color:var(--mu);font-size:20px;display:grid;place-items:center}
.x:active{background:var(--s3)}
.confirm{height:44px;padding:0 14px;border-radius:10px;background:var(--acc);color:var(--acc-tx);font-weight:700;font-size:14px}
.addbtn{width:100%;min-height:52px;border-top:1px solid var(--line);color:var(--acc);font-weight:650;font-size:15px}
.addbtn:active{background:var(--s2)}
.pane{border-top:1px solid var(--line);padding:12px;background:#171513}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-2px -2px 12px;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:40px;padding:0 14px;border-radius:20px;background:var(--s2);color:var(--mu);font-size:14px;font-weight:600;border:1px solid transparent}
.tab.on{background:var(--acc-d);color:var(--acc);border-color:#00e5ff55}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:60px;padding:10px 12px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.opt:active{background:var(--s3);transform:scale(.99)}
.opt .on{flex:1;min-width:0}
.opt .on div:first-child{font-weight:600;font-size:15px}
.opt .mac{font-size:12px;color:var(--mu);text-align:right;white-space:nowrap}
.opt .mac b{color:var(--acc);font-size:15px;display:block}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;min-height:48px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--s3);color:var(--tx)}
.seg button small{display:block;font-weight:500;font-size:11px;color:var(--mu)}
.btn{min-height:52px;border-radius:12px;padding:0 18px;font-weight:700;background:var(--s3);width:100%}
.btn.pri{background:var(--acc);color:var(--acc-tx)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.sm{min-height:44px;width:auto;font-size:14px;padding:0 14px}
.btn:active{filter:brightness(1.1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label.f{display:block;font-size:12px;color:var(--mu)}
label.f input{margin-top:4px}
.check{display:flex;align-items:center;gap:12px;min-height:52px;padding:4px 0;cursor:pointer}
.check input{width:24px;height:24px;min-height:0;accent-color:var(--acc);flex:none}
.borrow{padding:4px 0}
.borrow p{margin:0 0 10px}

/* banners */
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r2);background:var(--s2);border:1px solid var(--line);margin-top:12px;font-size:14px}
.banner .sp{min-width:0}
.pushnote{font-size:13px;color:var(--mu);margin-top:8px;padding:10px 12px;border-left:3px solid var(--kc);background:var(--s2);border-radius:0 10px 10px 0}

/* week */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);padding:12px}
.tile .v{font-size:24px;font-weight:700}
.tile .k{font-size:12px;color:var(--mu)}
.tile.hero .v{color:var(--acc)}
.drow{display:grid;grid-template-columns:62px 1fr 1fr 96px;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.drow input{min-height:44px;padding:8px;text-align:right}
.drow .ok{color:var(--acc);margin-left:4px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:5px;background:var(--s3)}
.dot.on{background:var(--acc)}
.dot.today{outline:2px solid var(--mu2);outline-offset:1px}
.streak{display:inline-flex;align-items:center;gap:8px;font-weight:650}
.streak.dim{opacity:.45}

/* library */
.libitem{padding:12px 0;border-bottom:1px solid var(--line)}
.libitem .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.form{background:var(--s2);border-radius:12px;padding:12px;margin-top:8px}
.form input{background:var(--s1)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#161412ee;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:10}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--mu);font-weight:600}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe-b) + 12px);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.18s;z-index:20;width:calc(100% - 32px);max-width:528px}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast .t{display:flex;align-items:center;gap:10px;background:#f3efe9;color:#131110;border-radius:14px;padding:6px 6px 6px 16px;min-height:56px;font-weight:600;font-size:14px;box-shadow:0 8px 30px #0008}
#toast .t span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{height:44px;padding:0 16px;border-radius:10px;background:#131110;color:var(--acc);font-weight:700}
#toast .bar{height:3px;background:#0002;margin:0 14px;border-radius:2px;position:relative;top:-6px}
#toast .bar i{background:#131110}
@keyframes drain{from{width:100%}to{width:0}}
</style>
</head>

<script>
'use strict';
/* ============================== core ============================== */
const SEED = JSON.parse(document.getElementById('seed').textContent);
const KEY = 'slots_state', SHARED = 'ac_shared_body';
const KCAL_FLOOR = 1800, BIG = 900, GUESS_PAD = 1.2, UNDO_MS = 5000;
const $ = (s, el = document) => el.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 10);
const r0 = n => Math.round(Number(n) || 0);
const fmt = n => r0(n).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dkey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const kdate = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = kdate(k); d.setDate(d.getDate() + n); return dkey(d); };
const today = () => dkey();
const dayLabel = k => kdate(k).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const wd = k => kdate(k).toLocaleDateString('en-US', { weekday: 'short' });

function fresh() {

function totals(k, withPlanned = false) {
  const t = { kcal: 0, p: 0, c: 0, f: 0, plannedKcal: 0, plannedP: 0 };
  peekDay(k).entries.forEach(e => {
    if (e.planned) { t.plannedKcal += e.kcal; t.plannedP += e.p; if (!withPlanned) return; }

}

  peekDay(k).entries.forEach(e => {
    const br = e.borrow;
    if (!br || !b[br.from] || !b[e.slot] || !canBorrowFrom(br.from)) return;
    b[e.slot].kcal += br.kcal; b[e.slot].borrowed += br.kcal;

}

    .map(([id, frac]) => ({ from: id, kcal: r0((T.slots[id] || [0])[0] * frac), label: (frac < 1 ? '½ ' : '') + slotName(id), used: used.has(id) }))

  if (plannedCount && !fut) h += `<div class="banner"><span class="sp">${plannedCount} planned item${plannedCount > 1 ? 's' : ''} — confirm as you eat.</span><button class="btn pri sm" data-act="confirmAll">Confirm all</button></div>`;
  if (fut) h += `<div class="banner"><span class="sp muted">Planning ahead. Items here are ghosts until you confirm them on the day.</span></div>`;

  h += state.slots.map(s => vSlot(s, D, b[s.id], k)).join('');

  // steps + plan tomorrow + streak
  h += `<h2>${fut ? 'This day' : 'Tomorrow'}</h2><div class="card stack">`;
  if (!fut) h += `<button class="btn" data-act="copyTomorrow">Copy ${isToday ? 'today' : 'this day'} → ${wd(addDays(k, 1))}</button>`;
  h += state.templates.length ? `<div class="small muted">Day templates</div><div class="opts">${state.templates.map(tp => {
      const tt = tp.entries.reduce((a, e) => (a.k += e.kcal, a.p += e.p, a), { k: 0, p: 0 });
      return `<button class="opt" data-act="applyTpl" data-id="${tp.id}" data-to="${fut ? 'here' : 'next'}"><div class="on"><div>${esc(tp.name)}</div><div class="muted tiny">${tp.entries.length} items → ${fut ? 'this day' : wd(addDays(k, 1))}</div></div><div class="mac"><b>${fmt(tt.p)}P</b>${fmt(tt.k)} kcal</div></button>`; }).join('')}</div>` : '';
  h += ui.tplName
    ? `<div class="row"><input name="tplname" placeholder="Template name" maxlength="40"><button class="btn pri sm" data-act="saveTpl">Save</button></div>`
    : `<button class="btn ghost" data-act="tplNameToggle">Save ${isToday ? 'today' : 'this day'} as template</button>`;
  h += `</div>`;
  if (!fut) h += `<h2>Steps</h2><div class="card row"><input name="steps" data-k="${k}" type="number" inputmode="numeric" placeholder="Steps ${isToday ? 'today' : 'this day'}" value="${D.steps ?? ''}"><span class="muted small" style="white-space:nowrap">goal ${fmt(state.settings.stepsGoal)}</span></div>`;
  h += `<div class="row" style="margin-top:18px;justify-content:center"><span class="streak ${st.dim ? 'dim' : ''}"><span style="color:var(--acc)">●</span> ${fmt(st.count)} day${st.count === 1 ? '' : 's'} logged</span></div>`;
  return h;
}

function vSlot(s, D, bud, k) {
  const es = D.entries.filter(e => e.slot === s.id);
  const used = es.filter(e => !e.planned).reduce((a, e) => (a.k += e.kcal, a.p += e.p, a), { k: 0, p: 0 });
  const plan = es.filter(e => e.planned).reduce((a, e) => a + e.kcal, 0);
  const open = ui.open === s.id;
  const over = used.k > bud.kcal && bud.kcal > 0;
  const tags = (s.protected ? '<span class="lock">PROTECTED</span>' : '') +
    (bud.borrowed ? `<span class="borrowtag">+${fmt(bud.borrowed)} borrowed</span>` : '') +
    (bud.lent ? `<span class="borrowtag">lent ${fmt(bud.lent)}</span>` : '');
  let h = `<section class="slot ${open ? 'open' : ''}" data-slot="${s.id}">
    <div class="slot-h">
      <div class="row"><div class="sp"><span class="name">${esc(s.name)}</span>${tags}</div>
        <div class="slot-nums">${bud.p ? `<b>${fmt(used.p)}</b>/${fmt(bud.p)} g P<br>` : ''}${fmt(used.k)}/${fmt(Math.max(0, bud.kcal))} kcal</div></div>
      <div class="slot-bars">
        ${bud.p ? `<div class="bar thin"><i class="p" style="width:${pct(used.p, bud.p)}%"></i></div>` : ''}
        <div class="bar thin"><i class="pl" style="width:${pct(used.k + plan, bud.kcal)}%"></i><i class="${over ? 'over' : 'k'}" style="width:${pct(used.k, bud.kcal)}%"></i></div>
      </div>
    </div>`;
  if (es.length) h += `<div class="entries">${es.map(e => `
    <div class="entry ${e.planned ? 'planned' : ''}">
      <div class="en"><div>${esc(e.name)}</div><div class="muted tiny">${e.planned ? 'planned · ' : ''}${fmt(e.kcal)} kcal · ${fmt(e.p)}g P${e.borrow ? ` · borrowed ${fmt(e.borrow.kcal)} from ${esc(slotName(e.borrow.from))}` : ''}</div></div>
      ${e.planned && !isFuture(k) ? `<button class="confirm" data-act="confirm" data-id="${e.id}">Confirm</button>` : ''}
      <button class="x" data-act="rm" data-id="${e.id}" aria-label="Remove">×</button>
    </div>`).join('')}</div>`;
  if (open) h += `<div class="pane" data-pane="${s.id}">${ui.pending && ui.pending.slot === s.id ? vBorrow(s, k) : vPane(s)}</div>`;
  else h += `<button class="addbtn" data-act="open" data-slot="${s.id}">+ Add to ${esc(s.name)}</button>`;
  return h + '</section>';
}

function vBorrow(s, k) {
  const e = ui.pending, opts = borrowOptions(k, s.id);
  return `<div class="borrow"><p><b>${esc(e.name)}</b> is ${fmt(e.kcal)} kcal — a two-slot meal. Which slot does it borrow from?</p>
    <div class="opts">${opts.map(o => `<button class="opt" data-act="borrow" data-from="${o.from}"><div class="on"><div>${esc(o.label)}</div>${o.used ? '<div class="muted tiny">already lent today</div>' : ''}</div><div class="mac"><b>${fmt(o.kcal)}</b>kcal</div></button>`).join('')}</div>
    <p class="muted tiny" style="margin:10px 0">Dessert stays protected.</p>
    <div class="grid2"><button class="btn ghost" data-act="noBorrow">Log, no borrow</button><button class="btn ghost" data-act="cancelBorrow">Cancel</button></div></div>`;
}

function vPane(s) {
  const tabs = [];

  const cur = tabs.some(t => t[0] === ui.tab[s.id]) ? ui.tab[s.id] : tabs[0][0];
  let h = `<div class="tabs">${tabs.map(([id, l]) => `<button class="tab ${cur === id ? 'on' : ''}" data-act="tab" data-slot="${s.id}" data-t="${id}">${l}</button>`).join('')}</div>`;
  const optBtn = (it, src) => `<button class="opt" data-act="pick" data-slot="${s.id}" data-src="${src}" data-id="${it.id}"><div class="on"><div>${esc(it.name)}</div>${it.note ? `<div class="muted tiny">${esc(it.note)}</div>` : ''}</div><div class="mac"><b>${fmt(it.p)}g</b>${fmt(it.kcal)} kcal</div></button>`;
  if (cur === 'opts') { const L = libFor(s.id); h += L.length ? `<div class="opts">${L.map(it => optBtn(it, s.lib)).join('')}</div>` : '<p class="muted small">No options yet — add some in Library.</p>'; }
  if (cur === 'takeout') {

    h += `<div class="tabs">${cats.map(id => `<button class="tab ${c === id ? 'on' : ''}" data-act="toCat" data-c="${id}">${esc(state.takeout[id].label)}</button>`).join('')}</div>`;

  }
  if (cur === 'family') {

    h += `<div class="seg">${Object.keys(z).map(id => `<button class="${ui.fam.size === id ? 'on' : ''}" data-act="famSize" data-v="${id}">${id[0].toUpperCase() + id.slice(1)}<small>~${fmt(z[id].kcal)}</small></button>`).join('')}</div>
      <div class="small muted" style="margin:12px 0 6px">Protein add-on</div>
      <div class="seg">${Object.keys(F.addons).map(id => `<button class="${ui.fam.add === id ? 'on' : ''}" data-act="famAdd" data-v="${id}">${esc(F.addons[id].name)}<small>+${F.addons[id].p}g P</small></button>`).join('')}</div>
      <button class="btn pri" style="margin-top:12px" data-act="famLog" data-slot="${s.id}">Log family meal · ${fmt(tp)}g P · ${fmt(tk)} kcal</button>`;
  }
  if (cur === 'guess') h += `<p class="muted small" style="margin-top:0">Unplanned? Ballpark it. Slots adds 20% so the estimate leans honest — that’s all.</p>
    <div class="grid2"><label class="f">Calories (guess)<input name="gk" type="number" inputmode="numeric" placeholder="e.g. 800"></label>
    <label class="f">Protein g (optional)<input name="gp" type="number" inputmode="numeric" placeholder="e.g. 35"></label></div>
    <label class="f" style="margin-top:8px">What was it? (optional)<input name="gn" placeholder="Unplanned meal" maxlength="60"></label>

  if (cur === 'custom') h += `<label class="f">Name<input name="cn" placeholder="What is it?" maxlength="60"></label>
    <div class="grid4" style="margin-top:8px"><label class="f">kcal<input name="ck" type="number" inputmode="numeric"></label><label class="f">P<input name="cp" type="number" inputmode="numeric"></label><label class="f">C<input name="cc" type="number" inputmode="numeric"></label><label class="f">F<input name="cf" type="number" inputmode="numeric"></label></div>
    <label class="check"><input type="checkbox" name="csave"> Save to My orders</label>
    <button class="btn pri" data-act="custom" data-slot="${s.id}">Log it</button>`;
  return h + `<button class="btn ghost" style="margin-top:12px" data-act="open" data-slot="${s.id}">Close</button>`;
}

/* ---------- week ---------- */
const AUDIT = [
  { k: 'steps', l: 'Steps averaged at goal' },
  { k: 'protein', l: 'Protein hit 5+ days' },
  { k: 'takeout', l: 'Every takeout meal logged' },
  { k: 'weekend', l: 'No weekend gap (Fri–Sun logged)' },
  { k: 'liquid', l: 'Liquid calories logged (drinks, creamer, alcohol)' },
  { k: 'sleep', l: 'Sleep ~7 h most nights' },
  { k: 'sessions', l: 'Training sessions done' }
];
function weekStats(end = today()) {
  const keys = Array.from({ length: 7 }, (_, i) => addDays(end, i - 6));
  const T = tier(), L = keys.filter(logged), S = keys.map(k => peekDay(k).steps).filter(v => v != null && v !== '');
  const sum = (a, f) => a.reduce((x, y) => x + f(y), 0);
  return {
    keys, logged: L.length,
    kcal: L.length ? sum(L, k => totals(k).kcal) / L.length : 0,
    p: L.length ? sum(L, k => totals(k).p) / L.length : 0,
    steps: S.length ? sum(S, Number) / S.length : 0, stepsN: S.length,
    pDays: keys.filter(k => logged(k) && totals(k).p >= T.p).length,
    takeout: sum(keys, k => peekDay(k).entries.filter(e => !e.planned && e.kind === 'takeout').length),
    weekend: keys.filter(k => [5, 6, 0].includes(kdate(k).getDay())).map(k => wd(k) + (logged(k) ? ' ✓' : ' –')).join('  ')
  };
}
function vWeek() {
  const w = weekStats(), T = tier(), st = streak(), M = readShared(), t = today();
  const hint = { steps: `${fmt(w.steps)} avg`, protein: `${w.pDays}/7`, takeout: `${w.takeout} logged`, weekend: w.weekend };
  const a = state.audits[lastSunday()] || {};
  let h = `<div class="top"><h1 class="sp">Week</h1><span class="muted small">${dayLabel(w.keys[0])} – ${dayLabel(w.keys[6])}</span></div>
  <div class="tiles">
    <div class="tile hero"><div class="v">${fmt(w.p)}<span style="font-size:14px">g</span></div><div class="k">avg protein · target ${fmt(T.p)}</div></div>
    <div class="tile"><div class="v">${fmt(w.kcal)}</div><div class="k">avg kcal · target ${fmt(T.kcal)}</div></div>
    <div class="tile"><div class="v">${w.stepsN ? fmt(w.steps) : '—'}</div><div class="k">avg steps${w.stepsN ? ` · ${w.stepsN} days entered` : ''}</div></div>
    <div class="tile"><div class="v">${w.logged}<span style="font-size:14px">/7</span></div><div class="k">days logged · protein hit ${w.pDays}</div></div>
  </div>`;
  if (M.latest_weight != null || M.trend_7d != null) h += `<div class="banner"><span class="sp muted">From Meter</span>${M.latest_weight != null ? `<b>${esc(M.latest_weight)}</b>` : ''}${M.trend_7d != null ? `<span class="muted small">7d ${esc(M.trend_7d)}</span>` : ''}</div>`;
  h += `<h2>Days</h2><div class="card" style="padding:4px 14px">
    <div class="drow muted tiny" style="border:0"><span></span><span>kcal</span><span>protein</span><span style="text-align:right">steps</span></div>
    ${w.keys.slice().reverse().map(k => { const tt = totals(k), lg = logged(k), D = peekDay(k);
      return `<div class="drow"><span><b>${wd(k)}</b><br><span class="muted tiny">${kdate(k).getDate()}</span></span>
      <span>${lg ? fmt(tt.kcal) : '<span class="muted">—</span>'}</span>
      <span>${lg ? fmt(tt.p) + 'g' + (tt.p >= T.p ? '<span class="ok">✓</span>' : '') : '<span class="muted">—</span>'}</span>
      <input name="steps" data-k="${k}" type="number" inputmode="numeric" value="${D.steps ?? ''}" placeholder="—"></div>`; }).join('')}
  </div>
  <h2>Logging</h2><div class="card"><div class="row"><span class="streak ${st.dim ? 'dim' : ''}">${fmt(st.count)} day${st.count === 1 ? "" : "s"} logged</span><span class="sp"></span><span class="muted tiny">misses dim it, never reset it</span></div>
    <div class="dots" style="margin-top:12px">${Array.from({ length: 14 }, (_, i) => addDays(t, i - 13)).map(k => `<span class="dot ${logged(k) ? 'on' : ''} ${k === t ? 'today' : ''}" title="${k}"></span>`).join('')}</div></div>
  <h2>Sunday speed audit</h2><div class="card" style="padding:4px 14px">
    ${AUDIT.map(x => `<label class="check"><input type="checkbox" data-act="audit" data-k="${x.k}" ${a[x.k] ? 'checked' : ''}><span class="sp">${x.l}</span>${hint[x.k] ? `<span class="muted tiny" style="text-align:right">${esc(hint[x.k])}</span>` : ''}</label>`).join('')}
  </div><p class="muted tiny">Week of ${dayLabel(lastSunday())}. Checks reset each Sunday.</p>`;
  return h;
}

/* ============================== events ============================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') return; // handled on change
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset); }
});
document.addEventListener('change', e => {
  const el = e.target;
